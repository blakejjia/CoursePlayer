name: lemon
description: "Lemon🍋‍ - offline music player"
version: 1.1.0+6

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # officially maintained
  go_router: ^17.2.3
  crypto: ^3.0.6
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  meta: ^1.17.0
  async: ^2.11.0
  path: ^1.9.0

  # audio service
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  rxdart: ^0.28.0

  # other audio related
  audiotags: ^1.4.5
  file_picker: ^11.0.2

  # riverpod
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^2.6.1

  # all other 3-rd party packages
  permission_handler: ^12.0.1
  equatable: ^2.0.5
  share_plus: ^12.0.2
  fluttertoast: ^9.0.0
  http: ^1.2.2
  uuid: ^4.5.1
  google_generative_ai: ^0.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.4
  riverpod_generator: ^2.6.4
  flutter_launcher_icons: ^0.14.3

# Ensure analyzer plugin compatibility with Dart 3.5/analyzer 7
dependency_overrides:
  analyzer: ^9.0.0
  analyzer_plugin: ^0.13.0

flutter:
  uses-material-design: true
  assets:
    - "assets/lang/appInfo/zh.json"
    - "assets/lang/appInfo/en.json"
    - "assets/default_cover.jpeg"
